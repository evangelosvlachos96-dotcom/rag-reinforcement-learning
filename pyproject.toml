[project]
name = "rag-reinforcement-learning"
version = "0.1.0"
description = "Multi-armed bandits that learn which RAG retrieval configuration to use, rewarded by retrieval evaluation metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Evangelos Vlachos" }]
keywords = ["reinforcement-learning", "bandits", "rag", "retrieval", "evaluation"]
dependencies = [
  "agentic-rag-eval-platform",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.14",
]

[project.scripts]
rl-rag-build-rewards = "rl_rag.build_rewards:main"
rl-rag-simulate = "rl_rag.simulate:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_rag"]

[tool.uv.sources]
agentic-rag-eval-platform = { git = "https://github.com/evangelosvlachos96-dotcom/agentic-rag-eval-platform", rev = "7837dbfbcb40e6a42549bec85a10ee29a78e275c" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
